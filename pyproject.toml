[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "c3-airbridge"
version = "0.2.0"
description = "Experimental bounded-memory ESP32-C3 relay for iPhone agents"
requires-python = ">=3.11"
dependencies = ["zeroconf>=0.145,<1", "pyserial>=3.5,<4", "aiohttp>=3.11,<4", "Pillow>=11,<13"]

[project.scripts]
c3-airbridge = "airbridge.server:main"
c3-provision = "airbridge.provision:main"
c3-agent = "airbridge.agent:main"
c3-stack = "airbridge.supervisor:main"

[tool.setuptools.package-data]
airbridge = ["web/*.html"]

[tool.setuptools.packages.find]
where = ["backend"]
